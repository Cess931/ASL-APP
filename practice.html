<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - ASL Games</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <style>
        /* Reset */
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,Cantarell,'Helvetica Neue',sans-serif;background:var(--body-bg,#F0F2F5);color:var(--text-color,#050505);transition:background 0.8s ease,color 0.8s ease;position:relative}

        /* Header (Facebook-style) */
        .app-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:transparent !important;color:#050505;box-shadow:none;border-bottom:none;position:sticky;top:0;z-index:100;transition:background 0.8s ease,box-shadow 0.8s ease,border-bottom 0.8s ease}
        .app-title{font-size:1.25rem;font-weight:700;color:var(--title-color,#050505);flex:1;text-align:center;transition:color 0.8s ease}
        .back-btn{background:none;border:none;cursor:pointer;padding:0.5rem;display:flex;align-items:center;justify-content:center;color:var(--text-color,#050505);text-decoration:none;border-radius:50%;transition:background 0.2s ease,color 0.8s ease}
        .back-btn:hover{background:#F0F2F5}
        .night-theme .back-btn:hover{background:#1A345B}
        .back-btn:active{background:#E4E6EB}
        .night-theme .back-btn:active{background:#14284A}
        .back-btn .material-symbols-outlined{font-size:24px}
        .header-spacer{width:40px}
        /* Search input removed from header per request */

        /* Main layout */
        .container{max-width:1024px;margin:18px auto;padding:0 16px;position:relative;z-index:1}
        .actions-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}

        /* Grid of cards */
        .games-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:12px}
        @media(min-width:640px){.games-grid{grid-template-columns:repeat(2,1fr)}}
        @media(min-width:1000px){.games-grid{grid-template-columns:repeat(3,1fr)}}

        /* Card */
        .game-card{background:var(--card-bg,#FFFFFF);border-radius:8px;box-shadow:var(--card-shadow,0 1px 2px rgba(0,0,0,0.12));overflow:hidden;display:flex;flex-direction:column;transition:background 0.8s ease,box-shadow 0.8s ease;position:relative;z-index:1}
        .card-top{
    display:flex;
    align-items:center;
    padding:12px 16px;
    gap:12px;
}

        .game-avatar{width:48px;height:48px;border-radius:50%;background:#E4E6EB;display:flex;align-items:center;justify-content:center;color:#1877F2;font-weight:700}
        .game-title{font-size:1rem;font-weight:700;color:var(--text-color,#050505);transition:color 0.8s ease}
        .game-meta{font-size:0.875rem;color:#65676B}

        .card-body{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
        .desc{font-size:0.95rem;color:var(--text-color,#333);transition:color 0.8s ease}

        /* Options form */
        .options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .field{display:flex;flex-direction:column;gap:6px}
        label{font-size:0.85rem;color:#65676B}
        select,input[type=number]{padding:8px;border-radius:6px;border:1px solid #E4E6EB;background:#fff}
        /* toggles removed - UI uses defaults on card dataset */

        /* Footer: actions */
        .card-footer{padding:12px 16px;border-top:1px solid #E9EDF2;display:flex;align-items:center;justify-content:space-between;gap:8px}
        .play-btn{background:#1877F2;color:#FFF;padding:8px 14px;border-radius:999px;border:none;cursor:pointer;font-weight:600}
        .secondary-btn{background:#FFFFFF;color:#1877F2;border:1px solid #E4E6EB;padding:8px 12px;border-radius:999px;cursor:pointer}

        /* Small helper layout */
        .small{text-transform:uppercase;font-size:0.75rem;color:#65676B}
        .badge{font-size:0.8rem;background:#F0F2F5;padding:6px 8px;border-radius:6px}
        .badge.play-top{background:#1877F2;color:#FFF;border:none;padding:6px 10px;cursor:pointer;font-weight:600;border-radius:6px}

        /* Hover/focus states */
        .game-card:focus-within, .game-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(16,24,40,0.08)}
        .game-card{transition:all .15s ease}

        /* Footer notice */
        .no-games{padding:24px;text-align:center;background:var(--card-bg,#fff);border-radius:8px;box-shadow:var(--card-shadow,0 1px 2px rgba(0,0,0,0.05));transition:background 0.8s ease,box-shadow 0.8s ease}

        /* ------------------------------------------------ */
        /* --- THEME STYLES --- */
        /* ------------------------------------------------ */
        
        /* 1. MORNING (SUNNY) THEME: Sunny/Yellow-Orange */
        .sunny-theme {
            --body-bg: #FFE0B2;
            --header-bg: #FFCC80;
            --title-color: #E65100;
            --card-bg: #FFFFFF;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            --text-color: #050505;
        }

        /* 2. AFTERNOON (BLUE CLOUDY) THEME: Light Blue */
        .afternoon-theme {
            --body-bg: #E0F7FA;
            --header-bg: #B3E5FC;
            --title-color: #01579B;
            --card-bg: #FFFFFF;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            --text-color: #050505;
        }

        /* 3. NIGHT (DARK BLUE MOON/STARS) THEME */
        .night-theme {
            --body-bg: #0D1C3C;
            --header-bg: #14284A;
            --title-color: #B0C4DE;
            --card-bg: #1A345B;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            --text-color: #E0E0E0;
        }

        /* Theme Animation Background */
        .theme-animation-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: opacity 0.8s ease;
            pointer-events: none;
            overflow: hidden;
        }

        /* Sunny Theme - Animated Sun */
        .sunny-theme .theme-animation-bg {
            background: linear-gradient(135deg, #FFB74D 0%, #FFECB3 100%);
            opacity: 0.4;
        }

        .sunny-theme .theme-animation-bg::before {
            content: '';
            position: absolute;
            top: 10%;
            right: 10%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FFEB3B;
            box-shadow: 0 0 40px #FFD700;
            animation: pulseSun 4s ease-in-out infinite alternate;
        }

        @keyframes pulseSun {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Afternoon Theme - Animated Clouds */
        .afternoon-theme .theme-animation-bg {
            background: linear-gradient(135deg, #81D4FA 0%, #B3E5FC 100%);
            opacity: 0.4;
        }

        .afternoon-theme .theme-animation-bg::before,
        .afternoon-theme .theme-animation-bg::after {
            content: '';
            position: absolute;
            background: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow:
                60px -10px 0 10px white,
                -20px 20px 0 15px white,
                40px 40px 0 20px white;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            animation: moveClouds 20s linear infinite;
        }

        .afternoon-theme .theme-animation-bg::before {
            top: 20%;
            left: -100px;
            transform: scale(1.1);
            animation-duration: 22s;
            --scale: 1.1;
        }

        .afternoon-theme .theme-animation-bg::after {
            top: 65%;
            left: -150px;
            transform: scale(0.7);
            animation-duration: 18s;
            --scale: 0.7;
        }

        @keyframes moveClouds {
            0% { transform: translateX(-100%) scale(var(--scale, 1)); }
            100% { transform: translateX(300%) scale(var(--scale, 1)); }
        }

        /* Night Theme - Animated Moon and Stars */
        .night-theme .theme-animation-bg {
            background: linear-gradient(135deg, #0A193F 0%, #1A3F70 100%);
            opacity: 0.6;
        }

        .night-theme .theme-animation-bg::before {
            content: '';
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #F0E68C;
            box-shadow: 0 0 15px rgba(255, 255, 200, 0.8);
            animation: floatMoon 6s ease-in-out infinite alternate;
            z-index: 2;
        }

        .night-theme .theme-animation-bg::after {
            content: '';
            position: absolute;
            background: #FFFFFF;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            box-shadow:
                40px 60px 0 0.5px #fff,
                80px 10px 0 1px #fff,
                100px 80px 0 0.5px #fff,
                10px 90px 0 1px #fff;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes floatMoon {
            0% { transform: translateY(0); }
            100% { transform: translateY(5px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="intro.html" class="back-btn" aria-label="Back">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="app-title">Let's Practice</h1>
        <div class="header-spacer"></div>
    </header>
    <div class="theme-animation-bg"></div>
    <main class="container">
        <div class="actions-row">
            <div class="small">Choose a game</div>
            <div style="display:flex;gap:8px">
                <button class="secondary-btn" id="shuffleGames">Shuffle</button>
            </div>
        </div>

        <section class="games-grid" id="gamesGrid">
            <!-- Game card template - will be built from data below -->
        </section>
    </main>

    <script>
        // Game definitions (name, filename, description)
        const games = [
            {id: 'Riddle', title: 'Riddle', file: 'Riddle.html', desc: 'Quick review with riddles.'},
            {id: 'gesture', title: 'Gesture Guess', file: 'Gesture Guess.html', desc: 'Guess the sign from the gesture.'}
        ];

        const gamesGrid = document.getElementById('gamesGrid');

        // Create card for each game
        function createGameCard(g){
            const el = document.createElement('article');
            el.className = 'game-card';
            el.innerHTML = `
                <div class="card-top">
                    <div class="game-avatar">${g.title.slice(0,1)}</div>
                    <div style="flex:1">
                        <div class="game-title">${g.title}</div>
                        <div class="game-meta">${g.desc}</div>
                    </div>
                    <button class="badge play-top" data-game="${g.id}" onclick="startGame(event)" aria-label="Play ${g.title}">Play</button>
                </div>
                
               
                </div>
            `;
            // set defaults on the card (used by gatherOptions)
            el.dataset.difficulty = 'medium';
            el.dataset.rounds = '5';
            el.dataset.hints = '1'; // 1 == true
            el.dataset.sound = '1'; // 1 == true
            return el;
        }

        function render(){
            gamesGrid.innerHTML = '';
            games.forEach(g => gamesGrid.appendChild(createGameCard(g)));
        }

        // Build query string from options
        function gatherOptions(gameId){
            // Read from the play button's parent card dataset. Using dataset makes these values stable defaults
            const card = document.querySelector(`.game-card [data-game='${gameId}']`)?.closest('.game-card');
            const difficulty = card?.dataset.difficulty || 'medium';
            const rounds = card?.dataset.rounds || '5';
            const hints = (card?.dataset.hints === '1') ? 1 : 0;
            const sound = (card?.dataset.sound === '1') ? 1 : 0;
            return {difficulty, rounds, hints, sound};
        }

        // Open a new tab with game options
        function openGame(ev){
            const game = ev.currentTarget.getAttribute('data-game');
            const gameInfo = games.find(g => g.id === game);
            const opts = gatherOptions(game);
            const params = new URLSearchParams(opts).toString();
            const url = `${encodeURI(gameInfo.file)}?${params}`;
            window.open(url, '_blank');
        }

        // Start game in current tab
        function startGame(ev){
            const game = ev.currentTarget.getAttribute('data-game');
            const gameInfo = games.find(g => g.id === game);
            const opts = gatherOptions(game);
            const params = new URLSearchParams(opts).toString();
            const url = `${encodeURI(gameInfo.file)}?${params}`;
            window.location.href = url;
        }

        // Helpers
        // No reset UI exists anymore; defaults live on the card dataset

        document.getElementById('shuffleGames').addEventListener('click',()=>{
            // Simple Fisher-Yates shuffle
            for(let i=games.length-1;i>0;i--){
                const j = Math.floor(Math.random()*(i+1));
                [games[i],games[j]] = [games[j],games[i]];
            }
            render();
        });

        // Nothing to toggle anymore (options removed) — no-op

        // Initial render
        render();

        // Theme Management based on Philippine Time
        function applyTheme() {
            let body = document.body;

            // Force Philippine Time (UTC+8)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const philTime = new Date(utc + (8 * 60 * 60 * 1000));

            let hour = philTime.getHours();
            let themeClass = "";

            // 1. Morning (Sunny Theme): 5:00 AM - 11:59 AM
            if (hour >= 5 && hour < 12) {
                themeClass = "sunny-theme";
            // 2. Afternoon (Blue Cloudy Theme): 12:00 PM - 4:59 PM
            } else if (hour >= 12 && hour < 17) {
                themeClass = "afternoon-theme";
            // 3. Night (Dark Blue Moon/Stars Theme): 5:00 PM - 4:59 AM
            } else {
                themeClass = "night-theme";
            }

            // Apply theme class to the body
            body.className = themeClass;
        }

        // Run on load
        applyTheme();

        // Update theme every minute
        setInterval(applyTheme, 60000);
    </script>
</body>

</html>
