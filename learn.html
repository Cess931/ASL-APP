        /* ------------------------------------------------ */
        /* --- THEME STYLES --- */
        /* ------------------------------------------------ */
        
        /* 1. MORNING (SUNNY) THEME: Sunny/Yellow-Orange */
        .sunny-theme {
            --body-bg: #FFE0B2;
            --header-bg: #FFCC80;
            --title-color: #E65100;
            --card-bg: #FFFFFF;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            --text-color: #050505;
        }

        /* 2. AFTERNOON (BLUE CLOUDY) THEME: Light Blue */
        .afternoon-theme {
            --body-bg: #E0F7FA;
            --header-bg: #B3E5FC;
            --title-color: #01579B;
            --card-bg: #FFFFFF;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            --text-color: #050505;
        }

        /* 3. NIGHT (DARK BLUE MOON/STARS) THEME */
        .night-theme {
            --body-bg: #0D1C3C;
            --header-bg: #14284A;
            --title-color: #B0C4DE;
            --card-bg: #1A345B;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            --text-color: #E0E0E0;
        }

        /* Theme Animation Background */
        .theme-animation-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: opacity 0.8s ease;
            pointer-events: none;
            overflow: hidden;
        }

        /* Sunny Theme - Animated Sun */
        .sunny-theme .theme-animation-bg {
            background: linear-gradient(135deg, #FFB74D 0%, #FFECB3 100%);
            opacity: 0.4;
        }

        .sunny-theme .theme-animation-bg::before {
            content: '';
            position: absolute;
            top: 10%;
            right: 10%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FFEB3B;
            box-shadow: 0 0 40px #FFD700;
            animation: pulseSun 4s ease-in-out infinite alternate;
        }

        @keyframes pulseSun {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Afternoon Theme - Animated Clouds */
        .afternoon-theme .theme-animation-bg {
            background: linear-gradient(135deg, #81D4FA 0%, #B3E5FC 100%);
            opacity: 0.4;
        }

        .afternoon-theme .theme-animation-bg::before,
        .afternoon-theme .theme-animation-bg::after {
            content: '';
            position: absolute;
            background: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow:
                60px -10px 0 10px white,
                -20px 20px 0 15px white,
                40px 40px 0 20px white;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            animation: moveClouds 20s linear infinite;
        }

        .afternoon-theme .theme-animation-bg::before {
            top: 20%;
            left: -100px;
            transform: scale(1.1);
            animation-duration: 22s;
            --scale: 1.1;
        }

        .afternoon-theme .theme-animation-bg::after {
            top: 65%;
            left: -150px;
            transform: scale(0.7);
            animation-duration: 18s;
            --scale: 0.7;
        }

        @keyframes moveClouds {
            0% { transform: translateX(-100%) scale(var(--scale, 1)); }
            100% { transform: translateX(300%) scale(var(--scale, 1)); }
        }

        /* Night Theme - Animated Moon and Stars */
        .night-theme .theme-animation-bg {
            background: linear-gradient(135deg, #0A193F 0%, #1A3F70 100%);
            opacity: 0.6;
        }

        .night-theme .theme-animation-bg::before {
            content: '';
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #F0E68C;
            box-shadow: 0 0 15px rgba(255, 255, 200, 0.8);
            animation: floatMoon 6s ease-in-out infinite alternate;
            z-index: 2;
        }

        .night-theme .theme-animation-bg::after {
            content: '';
            position: absolute;
            background: #FFFFFF;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            box-shadow:
                40px 60px 0 0.5px #fff,
                80px 10px 0 1px #fff,
                100px 80px 0 0.5px #fff,
                10px 90px 0 1px #fff;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes floatMoon {
            0% { transform: translateY(0); }
            100% { transform: translateY(5px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>

            "Excuse me": "Slide fingertips across opposite palm.",
            "See you later": "V-hand from eyes then L-hand gesture.",
            "See you tomorrow": "V-hand from eyes then thumb-up moving forward."
        };

        // Mapping of phrases to example GIFs (relative path to GIF folder)
        const gifMapping = {
            'Hello': ['hello.gif'],
            'Goodbye': ['goodbye.gif'],
            'Please': ['please.gif'],
            'Sorry': ['sorry.gif'],
            'Good morning': ['good_morning.gif'],
            'Good night': ['good_night.gif'],
            'How are you?': ['how_are_you.gif'],
            'Nice to meet you': ['nice_to_meet_you.gif'],
            "What's your name?": ['whats_your_name.gif'],
            'My name is...': ['my_name_is.gif'],
            'Thank you': ['thank_you.gif'],
            'Hungry': ['hungry.gif'],
            'Tired': ['tired.gif'],
            'Busy': ['busy.gif'],
            'Help': ['help.gif'],
            'Deaf': ['deaf.gif'],
            'Hearing': ['hearing.gif'],
            'Hard of hearing': ['hard_of_hearing.gif'],
            'Good': ['good.gif'],
            'Bad': ['bad.gif'],
            'Fine': ['fine.gif'],
            'Excuse me': ['excuse_me.gif'],
            'See you later': ['see_you_later.gif'],
            'See you tomorrow': ['see_you_tomorrow.gif']
        };

        function populateGifPanel(phrase) {
            const panel = document.getElementById('gifPanel');
            panel.innerHTML = '';
            const gifs = gifMapping[phrase] || [];
            if (gifs.length === 0) return;
            gifs.slice(0, 3).forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = src.split('/').pop().replace('.gif', '').replace(/_/g,' ');
                panel.appendChild(img);
            });
            // Try to size the GIFs to match the canvas (camera) if present
            updateGifSizes();
        }

        function updateGifSizes() {
            const canvasEl = document.getElementById('canvas');
            const panel = document.getElementById('gifPanel');
            if (!panel) return;
            const imgs = panel.querySelectorAll('img');
            let w = 400, h = 400; // fallback
            if (canvasEl && canvasEl.clientWidth && canvasEl.clientHeight) {
                w = canvasEl.clientWidth;
                h = canvasEl.clientHeight;
            } else if (canvasEl && canvasEl.width && canvasEl.height) {
                w = canvasEl.width;
                h = canvasEl.height;
            }
            imgs.forEach((img) => {
                img.style.width = w + 'px';
                img.style.height = h + 'px';
            });
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;
            synth.speak(utterance);
        }

        function stopAllSpeech() {
            synth.cancel();
        }

        function openPractice(phrase, modelURL) {
            currentPhrase = phrase;
            currentModelURL = modelURL;
            document.getElementById('practiceTitle').textContent = `Practice: ${phrase}`;
            document.getElementById('practiceModal').style.display = 'block';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            // SET INSTRUCTIONS
            document.getElementById('instructionText').textContent = instructions[phrase] || "No instructions found.";
            // Populate GIFs for the given phrase
            populateGifPanel(phrase);
        }

        function closePractice() {
            if (isRunning && webcam) {
                webcam.stop();
                isRunning = false;
            }
            stopAllSpeech();
            // Refresh the page when closing
            window.location.reload();
        }

        async function startPractice() {
            const modelURL = currentModelURL + 'model.json';
            const metadataURL = currentModelURL + 'metadata.json';

            try {
                // Load the pose model
                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Setup webcam
                const size = 400;
                const flip = true;
                webcam = new tmPose.Webcam(size, size, flip);
                await webcam.setup();
                await webcam.play();
                isRunning = true;

                // Setup canvas
                const canvas = document.getElementById('canvas');
                canvas.width = size;
                canvas.height = size;
                ctx = canvas.getContext('2d');
                // Resize GIF thumbnails to match new canvas size
                updateGifSizes();

                // Play audio of the phrase name when practice starts
                speak(currentPhrase);

                window.requestAnimationFrame(loop);
            } catch (error) {
                console.error('Error loading model:', error);
                alert('Error starting camera. Please allow camera access and try again.');
            }
        }

        async function loop() {
            if (isRunning) {
                webcam.update();
                await predict();
                window.requestAnimationFrame(loop);
            }
        }

        let lastCorrectTime = 0;
        const correctCooldown = 2000; // 2 seconds cooldown between "Correct!" messages

        async function predict() {
            // Estimate pose
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            // Run prediction
            const prediction = await model.predict(posenetOutput);

            let predictionsHTML = '';
            let maxPrediction = { className: '', probability: 0 };

            for (let i = 0; i < maxPredictions; i++) {
                const probability = (prediction[i].probability * 100).toFixed(1);
                predictionsHTML += `
                    <div class="prediction-item">
                        <span>${prediction[i].className}</span>
                        <span>${probability}%</span>
                    </div>
                `;

                if (prediction[i].probability > maxPrediction.probability) {
                    maxPrediction = prediction[i];
                }
            }

            document.getElementById('predictions').innerHTML = predictionsHTML;

            // Draw pose
            drawPose(pose);

            // Check if person is detected in camera (at least 5 keypoints with good confidence)
            const minKeypoints = 5;
            const minKeypointConfidence = 0.5;
            let detectedKeypoints = 0;
            if (pose && pose.keypoints) {
                detectedKeypoints = pose.keypoints.filter(kp => kp.score >= minKeypointConfidence).length;
            }

            // Only show feedback if person is detected AND prediction is above threshold
            const threshold = 0.7;
            const now = Date.now();
            
            if (detectedKeypoints >= minKeypoints && maxPrediction.probability > threshold) {
                const detectedPhrase = maxPrediction.className.toLowerCase().trim();
                const targetPhrase = currentPhrase.toLowerCase().trim();

                if (detectedPhrase === targetPhrase) {
                    // Only show "Correct!" if enough time has passed since last correct
                    if (now - lastCorrectTime >= correctCooldown) {
                        document.getElementById('feedback').textContent = '✓ Correct!';
                        document.getElementById('feedback').className = 'feedback correct';
                        speak('Correct!');
                        lastCorrectTime = now;
                    }
                } else {
                    document.getElementById('feedback').textContent = '✗ Try Again';
                    document.getElementById('feedback').className = 'feedback wrong';
                    // NO voice feedback for "Try Again" - removed speak('Try again');
                }
            } else if (detectedKeypoints < minKeypoints) {
                // No person detected - clear feedback
                document.getElementById('feedback').textContent = '';
                document.getElementById('feedback').className = 'feedback';
            }
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                // Draw keypoints and skeleton
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('practiceModal');
            if (event.target === modal) {
                closePractice();
            }
        }

        // Theme Management based on Philippine Time
        function applyTheme() {
            let body = document.body;

            // Force Philippine Time (UTC+8)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const philTime = new Date(utc + (8 * 60 * 60 * 1000));

            let hour = philTime.getHours();
            let themeClass = "";

            // 1. Morning (Sunny Theme): 5:00 AM - 11:59 AM
            if (hour >= 5 && hour < 12) {
                themeClass = "sunny-theme";
            // 2. Afternoon (Blue Cloudy Theme): 12:00 PM - 4:59 PM
            } else if (hour >= 12 && hour < 17) {
                themeClass = "afternoon-theme";
            // 3. Night (Dark Blue Moon/Stars Theme): 5:00 PM - 4:59 AM
            } else {
                themeClass = "night-theme";
            }

            // Apply theme class to the body
            body.className = themeClass;
        }

        // Run on load
        applyTheme();

        // Update theme every minute
        setInterval(applyTheme, 60000);
    </script>
</body>
</html>
